<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- the only font in the image is hack: give it to every generic family,
     else the bold sans of the window titles comes out as boxes -->
<fontconfig>
	<alias binding="strong"><family>sans-serif</family><prefer><family>Hack</family></prefer></alias>
	<alias binding="strong"><family>sans</family><prefer><family>Hack</family></prefer></alias>
	<alias binding="strong"><family>serif</family><prefer><family>Hack</family></prefer></alias>
	<alias binding="strong"><family>monospace</family><prefer><family>Hack</family></prefer></alias>
</fontconfig>