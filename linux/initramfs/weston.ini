# weston on the e6: drm backend + pixman (no gpu driver), 640x480.
# the panel gets ~5 full frames per second over the vc bus, so every
# animation is off and a terminal comes up right away

[core]
backend=drm
renderer=pixman
idle-time=0
# start even if libinput finds no keyboard
require-input=false

[shell]
background-color=0xff202833
panel-color=0xff10151c
panel-position=top
clock-format=minutes
locking=false
close-animation=none
startup-animation=none
focus-animation=none

[launcher]
icon=/usr/share/weston/icon_terminal.png
path=/usr/bin/e6-term

[autolaunch]
path=/usr/bin/e6-term

[keyboard]
# xkb-e6 = the printed layout, fn (arrow) = level 3 for the yellow
# digits/symbols, sym (KEY_COMPOSE = <MENU>) toggles en/ru
keymap_layout=e6,e6
keymap_variant=,ru
keymap_options=grp:menu_toggle,lv3:ralt_switch
repeat-rate=20
repeat-delay=500

[terminal]
font=Hack
font-size=13